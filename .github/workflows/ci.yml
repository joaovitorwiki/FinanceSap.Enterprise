name: FinanceSap.Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore

    - name: Run tests
      run: dotnet test --no-build --verbosity normal
      env:
        # Placeholder JWT secret for testing - handled by CustomWebApplicationFactory
        Jwt__Secret: ${{ secrets.JWT_SECRET || 'test-secret-at-least-32-chars-long-for-hmac-sha256' }}